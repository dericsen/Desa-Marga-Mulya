name: CI

on:
  push:
    paths-ignore: ["deck/**", ".github/workflows/deck.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  build-dan-uji:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: desa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/desa
      ADMIN_EMAIL: admin@margamulya.desa.id
      ADMIN_PASSWORD: UjiCI-Rahasia-2026
      SESSION_SECRET: rahasia-sesi-khusus-ci-yang-panjang
      SELLER_DEMO_PASSWORD: Penjual-CI-2026
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dependensi
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build (migrasi + seed + next build)
        run: npm run build

      - name: Migrasi ulang (uji idempoten)
        run: npm run db:setup

      - name: Jalankan server
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/ > /dev/null

      - name: Pasang Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Uji end-to-end
        run: node scripts/e2e.mjs

      - name: Audit tata letak (HP, tablet, laptop)
        if: always()
        continue-on-error: true
        run: node scripts/layout-audit.mjs

      - name: Log server
        if: always()
        run: cat server.log || true

      - name: Unggah screenshot & lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-uji
          path: |
            screenshots/
            package-lock.json
          if-no-files-found: ignore
