name: Pitch deck

on:
  push:
    paths: ["deck/**", ".github/workflows/deck.yml"]
  workflow_dispatch:
    inputs:
      demo_url:
        description: "URL website untuk slide & kode QR"
        required: false
        default: "https://desa-marga-mulya.vercel.app"

jobs:
  deck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deck
    env:
      DEMO_URL: ${{ github.event.inputs.demo_url || 'https://desa-marga-mulya.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pasang dependensi deck
        run: npm install --no-audit --no-fund
      - name: Buat deck
        run: npm run build
      - name: Pasang LibreOffice, Poppler & Montserrat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-liberation > /dev/null
          sudo apt-get install -y -qq fonts-montserrat > /dev/null 2>&1 || {
            mkdir -p ~/.fonts
            for w in Regular Bold Italic BoldItalic; do
              curl -sSfL -o ~/.fonts/Montserrat-$w.ttf "https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-$w.ttf"
            done
          }
          fc-cache -f > /dev/null; fc-list | grep -i montserrat | head -3
          pip install -q python-pptx "markitdown[pptx]"
      - name: Periksa isi & file
        run: |
          for f in out/*.pptx; do
            python3 -c "import sys; from pptx import Presentation; p=Presentation(sys.argv[1]); print(sys.argv[1], 'slides:', len(p.slides))" "$f"
          done
          markitdown out/Desa-Marga-Mulya-Pitch-Deck-New-Revisition.pptx > out/deck-text.md
          cat out/deck-text.md
      - name: Render ke PDF & gambar
        run: |
          cd out
          soffice --headless --convert-to pdf Desa-Marga-Mulya-Pitch-Deck-New-Revisition.pptx > /dev/null
          pdftoppm -jpeg -r 110 Desa-Marga-Mulya-Pitch-Deck-New-Revisition.pdf slide
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: pitch-deck
          path: deck/out/
